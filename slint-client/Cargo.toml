[package]
name = "whatsvelte-rust"
version = "1.4.0"
description = "Native (WebView-free) Slint desktop client wrapping the whatsapp-rust library"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "whatsvelte-rust"
path = "src/main.rs"

[build-dependencies]
slint-build = "1.18"

[dependencies]
# Native UI toolkit: no WebView, no JS runtime. Default features give the winit
# backend with the femtovg (OpenGL) renderer and the software fallback.
slint = { version = "1.18", features = ["unstable-winit-030"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time", "fs"] }
# Must match the major version whatsapp-rust uses, so the Receiver<Arc<Event>>
# type from the event handler lines up across the crate boundary.
async-channel = "2"
base64 = "0.22"
# Decode thumbnails / cached media into pixel buffers (replaces <img>).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# Render the pairing QR code natively (replaces the <canvas> QR).
qrcode = { version = "0.14", default-features = false }
# Native file picker (replaces tauri-plugin-dialog). On Linux it talks to the
# XDG desktop portal over D-Bus instead of linking GTK.
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "tokio"] }
# Open documents / videos / audio in the OS default app (replaces tauri-plugin-opener).
open = "5"
# OS data / download directories (replaces tauri's app.path()).
dirs = "6"
# HTTPS for profile pictures and the Klipy GIF API (same ureq the backend uses).
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Paste images from the clipboard into the composer.
arboard = "3"
# Voice notes: microphone capture + playback (cpal under the hood) and
# mp3/aac/m4a/vorbis/wav decoding for received audio.
rodio = { version = "0.23", default-features = false, features = ["playback", "recording", "mp3", "mp4", "vorbis", "wav"] }
# Voice notes are Ogg/Opus (what WhatsApp expects for push-to-talk).
opus = "0.4"
ogg = "0.9"
# Camera photo capture (AVFoundation / Media Foundation / V4L2).
nokhwa = { version = "0.10", features = ["input-native"] }
# Local-time formatting for chat stamps.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# The vendored protocol library, pulled in by path — unchanged by the migration.
whatsapp-rust = { path = "../rust-backend" }

# Installers (dmg/app, nsis, deb, AppImage) — replaces tauri-bundler.
# Run `cargo build --release && cargo packager --release` from this directory;
# installers land next to the binary in target/release (or target/<triple>/release).
[package.metadata.packager]
product-name = "whatsvelte-rust"
identifier = "com.ravesandstorm.whatsvelte-rust"
category = "SocialNetworking"
description = "Lightweight native WhatsApp desktop client (Slint + whatsapp-rust)"
icons = [
    "icons/32x32.png",
    "icons/64x64.png",
    "icons/128x128.png",
    "icons/128x128@2x.png",
    "icons/icon.icns",
    "icons/icon.ico",
]

[package.metadata.packager.macos]
minimum-system-version = "10.15"
signing-identity = "-"
# Camera / microphone usage strings for photo capture and voice notes.
info-plist-path = "Info.plist"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
