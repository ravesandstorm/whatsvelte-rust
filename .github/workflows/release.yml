name: Release

on:
  push:
    tags:
      - 'v*' # Triggers workflow on tags like v1.0.0

permissions:
  contents: write # Required to create the release and upload assets

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: ""
            formats: "deb,appimage"
          - os: macos-latest
            target: ""
            formats: "app,dmg"
          - os: windows-latest
            target: "x86_64-pc-windows-msvc" # Standard 64-bit Windows
            formats: "nsis"
          - os: windows-latest
            target: "aarch64-pc-windows-msvc" # ARM64 Windows
            formats: "nsis"
          - os: windows-latest
            target: "i686-pc-windows-msvc" # 32-bit Windows (x86)
            formats: "nsis"

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Slint (winit + femtovg) needs only windowing/font/GL headers — no
      # WebKitGTK. The file picker uses the XDG portal, so no GTK either.
      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfontconfig1-dev libxkbcommon-dev \
            libwayland-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libdbus-1-dev libssl-dev

      # rust-toolchain.toml pins a nightly; running rustup from the repo root
      # installs that toolchain, and cross targets must be added to it.
      - name: Install pinned toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Add cross target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './slint-client -> target'
          key: ${{ matrix.target }}

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Build and package
        working-directory: slint-client
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --target ${{ matrix.target }}
            cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.formats }}
          else
            cargo build --release
            cargo packager --release --formats ${{ matrix.formats }}
          fi

      # Give each Windows arch a distinct installer name so uploads don't clash.
      - name: Collect artifacts
        working-directory: slint-client
        run: |
          mkdir -p ../dist
          out=target/release
          if [ -n "${{ matrix.target }}" ]; then out=target/${{ matrix.target }}/release; fi
          for f in "$out"/*.dmg "$out"/*-setup.exe "$out"/*.deb "$out"/*.AppImage; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            if [ -n "${{ matrix.target }}" ]; then name="${{ matrix.target }}-$name"; fi
            cp "$f" "../dist/$name"
          done
          ls -la ../dist

      # macOS: the .dmg is ad-hoc signed (Cargo.toml packager signing-identity
      # "-") until Apple Developer ID secrets are configured.
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Release ${{ github.ref_name }}'
          body: 'Automated release generated by GitHub Actions.'
          draft: false
          prerelease: false
          files: dist/*
